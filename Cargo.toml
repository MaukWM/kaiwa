[package]
name = "kaiwa"
version = "0.1.0"
edition = "2024"

[dependencies]
poise = "0.6"
songbird = { version = "0.6", features = ["receive", "driver", "gateway", "serenity"] }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
