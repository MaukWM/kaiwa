[package]
name = "kaiwa"
version = "0.1.0"
edition = "2024"

[dependencies]
poise = "0.6"
songbird = { version = "0.6", features = ["receive", "driver", "gateway", "serenity"] }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
base64 = "0.22"
dotenvy = "0.15"
futures = "0.3"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
symphonia = { version = "0.5", default-features = false, features = ["pcm"] }
serde_json = "1"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
